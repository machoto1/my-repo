name: Manual
on:
  workflow_dispatch:  # 手動実行イベント
    inpuths:
      greeting:
        type: string
        default: Hello
        required: true
        description: A cheerful word
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ inputs.greeting }}" # 入力パラメータ「greegint」の参照
